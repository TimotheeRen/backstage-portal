apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage-frontend
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backstage-frontend
  template:
    metadata:
      labels:
        app: backstage-frontend
    spec:
      containers:
        - name: backstage-frontend
          image: timotheeren/backstage-frontend:sha-dc5f8c492c76cf857db8e68ce91303ae44208179
          ports:
            - containerPort: 80
