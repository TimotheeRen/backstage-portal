apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage-frontend
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backstage-frontend
  template:
    metadata:
      labels:
        app: backstage-frontend
    spec:
      containers:
        - name: backstage-frontend
          image: timotheeren/backstage-frontend:sha-2d47caa1320af03e3165c6ba17670794750487a0
          ports:
            - containerPort: 80
          env:
            - name: BACKEND_PORT
              value: "7000"
