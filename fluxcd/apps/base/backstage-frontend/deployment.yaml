apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage-frontend
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backstage-frontend
  template:
    metadata:
      labels:
        app: backstage-frontend
    spec:
      containers:
        - name: backstage-frontend
          image: timotheeren/backstage-frontend:sha-36fdfbac75765e2f3891de28aa14ca664ba9cb94
          ports:
            - containerPort: 80
