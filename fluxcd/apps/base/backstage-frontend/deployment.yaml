apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage-frontend
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backstage-frontend
  template:
    metadata:
      labels:
        app: backstage-frontend
    spec:
      containers:
        - name: backstage-frontend
          image: timotheeren/backstage-frontend:sha-1a635ba9852f0a69c0090e09c529c80a4529ed92
          ports:
            - containerPort: 80
          env:
            - name: BACKEND_HOST
              value: "localhost:7000"
