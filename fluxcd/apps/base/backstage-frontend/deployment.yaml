apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage-frontend
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backstage-frontend
  template:
    metadata:
      labels:
        app: backstage-frontend
    spec:
      containers:
        - name: backstage-frontend
          image: timotheeren/backstage-frontend:sha-084b90723bf1c1739d8f1b4fc8b5bebb2bfdc444
          ports:
            - containerPort: 80
          env:
            - name: BACKEND_HOST
              value: "localhost:8080"
