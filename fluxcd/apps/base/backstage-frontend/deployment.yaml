apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage-frontend
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backstage-frontend
  template:
    metadata:
      labels:
        app: backstage-frontend
    spec:
      containers:
        - name: backstage-frontend
          image: timotheeren/backstage-frontend:sha-8e3643c882f3744b2fae01a5fba7909df222d52d
          ports:
            - containerPort: 80
          env:
            - name: BACKEND_HOST
              value: "localhost:8080"
