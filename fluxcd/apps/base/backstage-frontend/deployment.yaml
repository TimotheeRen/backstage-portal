apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage-frontend
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backstage-frontend
  template:
    metadata:
      labels:
        app: backstage-frontend
    spec:
      containers:
        - name: backstage-frontend
          image: timotheeren/backstage-frontend:sha-d48a9a7cbbada764250cc31ed4337b054cc41a55
          ports:
            - containerPort: 80
          env:
            - name: BACKEND_HOST
              value: "localhost:7000"
