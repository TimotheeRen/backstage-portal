apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage-backend
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backstage-backend
  template:
    metadata:
      labels:
        app: backstage-backend
    spec:
      containers:
        - name: backstage-backend
          image: timotheeren/backstage-backend:sha-4a7323dcea9d72939373b2c14699de0943d1968f
          ports:
            - containerPort: 7007
          env:
            - name: POSTGRES_URI
              valueFrom:
                secretKeyRef:
                  name: backstage-postgres-cluster-app
                  key: uri
