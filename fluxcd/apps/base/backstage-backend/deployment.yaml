apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage-backend
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backstage-backend
  template:
    metadata:
      labels:
        app: backstage-backend
    spec:
      containers:
        - name: backstage-backend
          image: timotheeren/backstage-backend:sha-3a05b78528b76393d44005ce6f1abe09c2269bf0
          ports:
            - containerPort: 7007
