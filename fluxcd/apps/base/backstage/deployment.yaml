apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backstage
  template:
    metadata:
      labels:
        app: backstage
    spec:
      containers:
        - name: backstage
          image: timotheeren/backstage:sha-084b90723bf1c1739d8f1b4fc8b5bebb2bfdc444
          ports:
            - containerPort: 8080
          env:
            - name: POSTGRES_URI
              valueFrom:
                secretKeyRef:
                  name: backstage-postgres-cluster-app
                  key: uri
            - name: BACKEND_HOST
              value: "localhost:8080"
